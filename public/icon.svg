<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLinear" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#12131F"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="indigoSplit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6872D9"/>
      <stop offset="100%" stop-color="#4F58BA"/>
    </linearGradient>
    <filter id="luminousGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgLinear)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" fill="none"/>

  <rect x="156" y="214" width="200" height="26" rx="13" fill="url(#indigoSplit)" filter="url(#luminousGlow)"/>
  <rect x="156" y="272" width="200" height="26" rx="13" fill="url(#indigoSplit)" filter="url(#luminousGlow)"/>

  <circle cx="118" cy="256" r="16" fill="#5E6AD2"/>
  <circle cx="118" cy="256" r="28" stroke="rgba(94,106,210,0.35)" stroke-width="2" fill="none"/>

  <circle cx="394" cy="256" r="16" fill="#5E6AD2"/>
  <circle cx="394" cy="256" r="28" stroke="rgba(94,106,210,0.35)" stroke-width="2" fill="none"/>
</svg>
